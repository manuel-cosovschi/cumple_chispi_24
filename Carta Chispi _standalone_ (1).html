document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

low: hidden;\n  }\n\n  /* ========== TOP HEADER ========== */\n  .header {\n    position: absolute;\n    top: 0; left: 0; right: 0;\n    padding: 28px 40px;\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    z-index: 50;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10.5px;\n    font-weight: 300;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--muted);\n    pointer-events: none;\n  }\n  .header .left, .header .right { display: flex; gap: 18px; align-items: center; }\n  .header .dot {\n    width: 6px; height: 6px; border-radius: 50%;\n    background: var(--wax);\n    display: inline-block;\n    box-shadow: 0 0 8px rgba(139, 58, 46, 0.4);\n  }\n\n  /* ========== SAKURA PETALS (canvas) ========== */\n  #sakura {\n    position: absolute;\n    inset: 0;\n    pointer-events: none;\n    z-index: 2;\n  }\n\n  /* ========== ENVELOPE ========== */\n  .stage {\n    position: absolute;\n    inset: 0;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    z-index: 10;\n    transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1);\n  }\n  .stage.hidden { opacity: 0; pointer-events: none; }\n\n  .envelope-wrap {\n    position: relative;\n    width: min(440px, 80vw);\n    aspect-ratio: 1.55 / 1;\n    cursor: pointer;\n    perspective: 1600px;\n  }\n\n  .env-shadow {\n    position: absolute;\n    bottom: -22px; left: 6%; right: 6%;\n    height: 28px;\n    background: radial-gradient(ellipse at center, rgba(42, 38, 32, 0.22) 0%, transparent 70%);\n    filter: blur(8px);\n  }\n\n  .envelope {\n    position: relative;\n    width: 100%; height: 100%;\n    transform-style: preserve-3d;\n    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);\n  }\n  .envelope-wrap:hover .envelope { transform: translateY(-6px) rotateX(2deg); }\n\n  .env-body {\n    position: absolute;\n    inset: 0;\n    background:\n      linear-gradient(180deg, #FBF6E4 0%, #F0E6CC 100%);\n    border: 1px solid rent 70%);\n    transform: translateX(-100%);\n    transition: transform 0.6s ease;\n  }\n  .restart-btn:hover {\n    background: var(--ink);\n    color: var(--cream);\n    border-color: var(--ink);\n    letter-spacing: 0.36em;\n    transform: translateY(-1px);\n    box-shadow:\n      0 1px 0 rgba(255, 255, 255, 0.1) inset,\n      0 12px 32px -8px rgba(42, 38, 32, 0.3);\n  }\n  .restart-btn:hover::before { transform: translateX(100%); }\n\n  /* ========== MUSIC TOGGLE — refined glass ========== */\n  .music {\n    position: absolute;\n    bottom: 32px;\n    right: 32px;\n    z-index: 60;\n    display: flex;\n    align-items: center;\n    gap: 14px;\n    cursor: pointer;\n    user-select: none;\n    padding: 8px 8px 8px 18px;\n    background: rgba(253, 252, 240, 0.6);\n    backdrop-filter: blur(14px) saturate(1.1);\n    -webkit-backdrop-filter: blur(14px) saturate(1.1);\n    border: 1px solid rgba(42, 38, 32, 0.08);\n    border-radius: 999px;\n    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);\n    box-shadow:\n      0 1px 0 rgba(255, 255, 255, 0.7) inset,\n      0 8px 24px -10px rgba(42, 38, 32, 0.12);\n  }\n  .music:hover {\n    background: rgba(253, 252, 240, 0.85);\n    border-color: rgba(42, 38, 32, 0.15);\n    transform: translateY(-1px);\n    box-shadow:\n      0 1px 0 rgba(255, 255, 255, 0.8) inset,\n      0 12px 32px -10px rgba(42, 38, 32, 0.18);\n  }\n  .music-label {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px;\n    font-weight: 400;\n    letter-spacing: 0.28em;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n    transition: color 0.3s ease;\n  }\n  .music:hover .music-label { color: var(--ink); }\n\n  .music-icon {\n    position: relative;\n    width: 36px; height: 36px;\n    border-radius: 50%;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 2.5px;\n    background: linear-gradient(180deg, var(--cream), var(--cream-deep));\n    border: 1px solid rgba(42, 38, 32, 0.12);\n    transition: all 0.3s ease;\n  }\n  .music.active .music-icon {\n    background: linear-gradient(180deg, #fff, var(--cream));\n    border-color: var(--wax);\n    box-shadow: 0 0 0 3px rgba(139, 58, 46, 0.12);\n  }\n\n  .music-bar {\n    width: 2.5px;\n    height: 9px;\n    background: var(--ink-soft);\n    border-radius: 2px;\n    transform-origin: bottom;\n    transition: background 0.3s ease;\n  }\n  .music.active .music-bar { background: var(--wax); }\n  .music.active .music-bar:nth-child(1) { animation: bar 1.1s ease-in-out infinite; }\n  .music.active .music-bar:nth-child(2) { animation: bar 0.9s ease-in-out 0.15s infinite; }\n  .music.active .music-bar:nth-child(3) { animation: bar 1.3s ease-in-out 0.3s infinite; }\n  .music.active .music-bar:nth-child(4) { animation: bar 0.95s ease-in-out 0.05s infinite; }\n\n  @keyframes bar {\n    0%, 100% { transform: scaleY(0.4); }\n    50% { transform: scaleY(1.5); }\n  }\n\n  /* ========== FOOTER ========== */\n  .footer {\n    position: absolute;\n    bottom: 32px;\n    left: 40px;\n    z-index: 50;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px;\n    font-weight: 300;\n    letter-spacing: 0.26em;\n    text-transform: uppercase;\n    color: var(--muted);\n    pointer-events: none;\n  }\n\n  /* ========== PROGRESS ========== */\n  .progress {\n    position: absolute;\n    top: 50%;\n    left: 32px;\n    transform: translateY(-50%);\n    z-index: 35;\n    width: 1px;\n    height: 200px;\n    background: rgba(42, 38, 32, 0.08);\n    opacity: 0;\n    transition: opacity 0.8s ease;\n  }\n  .progress.visible { opacity: 1; }\n  .progress-fill {\n    width: 100%;\n    height: 0%;\n    background: linear-gradient(180deg, var(--wax), var(--ink));\n    transition: height 0.1s linear;\n  }\n  .progress-label {\n    position: absolute;\n    left: 14px;\n    top: -6px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 9px;\n    letter-spacing: 0.22em;\n    color: var(--muted);\n    white-space: nowrap;\n    text-transform: uppercase;\n  }\n\n  /* ========== CONFETTI ========== */\n  #confetti {\n    position: absolute;\n    inset: 0;\n    pointer-events: none;\n    z-index: 70;\n  }\n\n  @media (max-width: 640px) {\n    .header { padding: 22px 24px; font-size: 9px; }\n    .header .left span:not(.dot), .header .right span:nth-child(2) { display: none; }\n    .footer { left: 24px; bottom: 24px; font-size: 9px; }\n    .music { right: 24px; bottom: 24px; padding: 6px 6px 6px 14px; }\n    .music-label { display: none; }\n    .progress { display: none; }\n    .reader-fade-top { height: 28vh; }\n    .letter { padding: 36px 24px; }\n    .letter::before { top: 14px; bottom: 14px; left: 14px; right: 14px; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div id=\"app\">\n\n  <div class=\"header\">\n    <div class=\"left\">\n      <span class=\"dot\"><\u002Fspan>\n      <span>Correspondencia Privada<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"right\">\n      <span>N.º 24 / 2026<\u002Fspan>\n      <span>·<\u002Fspan>\n      <span>Edición Única<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <canvas id=\"sakura\"><\u002Fcanvas>\n\n  <div class=\"stage\" id=\"stage\">\n    <div class=\"envelope-wrap\" id=\"envelopeWrap\">\n      <div class=\"envelope\" id=\"envelope\">\n        <div class=\"env-body\">\n          <div class=\"env-meta\">Para — Chispi<\u002Fdiv>\n          <div class=\"env-meta-r\">14 · 10 · 2021<br>—<br>Hoy<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"letter-peek\"><\u002Fdiv>\n        <div class=\"seal\" aria-hidden=\"true\">M<\u002Fdiv>\n        <div class=\"env-flap\"><div class=\"env-flap-shape\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"env-shadow\"><\u002Fdiv>\n      <div class=\"env-hint\"><span class=\"pulse\"><\u002Fspan>Tocá para abrir<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"reader\" id=\"reader\">\n    <div class=\"reader-fade-top\"><\u002Fdiv>\n    <div class=\"scroll-track\">\n      <div class=\"letter\" id=\"letter\">\n        <div class=\"salutation\">¡Feliz cumple,<br>mi Chispi hermosa!<\u002Fdiv>\n\n        <p>Me puse a pensar en cómo empezó todo y me parece increíble que ya hayan pasado más de 4 años y pico desde ese 14 de octubre de 2021. Me acuerdo patente de ese primer \"Nazaaaaa\" que te mandé y de cómo, entre chistes, me terminaste agendando como \"Manuchin\" para hacerme la contra. Al final, yo te puse \"Chispita\" y, sin darnos cuenta, ese fue el primer párrafo de nuestra historia.<\u002Fp>\n\n        <p>Fuimos sumando capítulos y códigos que hoy son nuestra vida. Pasamos de ser Manu y Naza a ser tu Peluchito y mi Osita, armando un idioma propio donde el \"mueno\", el \"sipi\" y el \"bonis\" son lo más normal del mundo. En estos años aprendí que no hay nada más lindo que nuestros momentos, desde los más grandes hasta los más simples.<\u002Fp>\n\n        <div class=\"ornament\">· · ·<\u002Fdiv>\n\n        <p>Tuvimos esos planes gigantes que nos hacían una ilusión bárbara, como cuando soñábamos con Japón o cuando Disney era el próximo destino y la visa nos dio la espalda. Pero lo más valioso fue darnos cuenta de que, aunque el rumbo cambie, lo que importa es con quién vas. Terminamos en las playas de México viviendo algo increíble, y ahí me quedó claro que mi lugar favorito en el mundo es donde estés vos.<\u002Fp>\n\n        <p>Me encanta cómo armamos nuestra rutina. Adoro esos momentos en los que te dormís tus siestulis eternas para recargar pilas y yo me quedo ahí al lado, capaz aprovechando para estudiar o ver algún anime, pero siempre disfrutando de tenerte cerca como mi compañera. Admiro un montón todo el esfuerzo que le pusiste a la carrera, acompañada siempre por tus litros de tecito de vieja. Es increíble pensar que este viernes ya te recibís; me explota el pecho de orgullo al ver que todo ese laburo valió la pena y ya estás ahí de cumplir tu meta.<\u002Fp>\n\n        <div class=\"ornament\">· · ·<\u002Fdiv>\n\n        <p>Hoy llegamos a tus 24 años y me llena de felicidad ver la mujer en la que te convertiste. Sos mi reina, mi compañera y la persona con la que quiero seguir escribiendo todas las hojas que faltan. Ya en unos días tenemos nuestro próximo capítulo en Tandil para estar así, juntitos y desconectados de todo, disfrutando simplemente de nosotros dos.<\u002Fp>\n\n        <p>Gracias por estos cuatro años y medio de puro aguante y amor. Como nos decimos siempre, esto es para toda la vida.<\u002Fp>\n\n        <div class=\"closing\">Te amo, te adoro,<br>te cielo y te todo.<\u002Fdiv>\n        <div class=\"signature\">— Tu Manuchin.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"reader-fade-bottom\"><\u002Fdiv>\n\n    <div class=\"progress\" id=\"progress\">\n      <div class=\"progress-fill\" id=\"progressFill\"><\u002Fdiv>\n      <div class=\"progress-label\">24<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TICKET OVERLAY -->\n  <div class=\"ticket-overlay\" id=\"ticketOverlay\">\n    <div class=\"ticket-overlay-inner\">\n      <div class=\"ticket-wrap\" id=\"ticketWrap\">\n        <div class=\"ticket\" role=\"img\" aria-label=\"Ticket de viaje a Tandil\">\n          <div class=\"ticket-main\">\n            <div class=\"ticket-header\">\n              <div class=\"ticket-airline\">M&amp;C Travel<span>Boarding Pass · Edición 24<\u002Fspan><\u002Fdiv>\n              <div class=\"ticket-class\">Clase<strong>Para toda la vida<\u002Fstrong><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"ticket-route\">\n              <div class=\"ticket-city\">\n                <div class=\"ticket-code\">MDQ<\u002Fdiv>\n                <div class=\"ticket-city-name\">Mar del Plata<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"ticket-arrow\">\n                <svg width=\"56\" height=\"14\" viewBox=\"0 0 56 14\" fill=\"none\"><path d=\"M0 7 L48 7 M42 2 L48 7 L42 12\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"24\" cy=\"7\" r=\"1.6\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n                <div class=\"ticket-arrow-line\">Vuelo Directo<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"ticket-city right\">\n                <div class=\"ticket-code\">TDL<\u002Fdiv>\n                <div class=\"ticket-city-name\">Tandil<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"ticket-details\">\n              <div>\n                <div class=\"ticket-detail-label\">Destino<\u002Fdiv>\n                <div class=\"ticket-detail-value\">Valle de la Luna<br><em>Sierras de Tandil<\u002Fem><\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div class=\"ticket-detail-label\">Pasajeros<\u002Fdiv>\n                <div class=\"ticket-detail-value\">M &amp; C<br><em>Juntitos · 02<\u002Fem><\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div class=\"ticket-detail-label\">Estado<\u002Fdiv>\n                <div class=\"ticket-detail-value\">Confirmado<br><em>Desconectados<\u002Fem><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"ticket-divider\"><\u002Fdiv>\n          <div class=\"ticket-stub\">\n            <div class=\"ticket-stub-label\">Boarding<\u002Fdiv>\n            <div class=\"ticket-qr\" id=\"ticketQR\"><\u002Fdiv>\n            <div class=\"ticket-stub-num\"><span>Ref<\u002Fspan>MC-2410-24<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"restart-wrap\" id=\"restartWrap\">\n        <button class=\"restart-btn\" id=\"restartBtn\">Volver a leer<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"music\" id=\"music\">\n    <span class=\"music-label\">Melodía<\u002Fspan>\n    <div class=\"music-icon\">\n      <div class=\"music-bar\"><\u002Fdiv>\n      <div class=\"music-bar\"><\u002Fdiv>\n      <div class=\"music-bar\"><\u002Fdiv>\n      <div class=\"music-bar\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"footer\">M · &amp; · C — Para toda la vida<\u002Fdiv>\n\n  <canvas id=\"confetti\"><\u002Fcanvas>\n\n<\u002Fdiv>\n\n<script>\n  // ============ SAKURA SYSTEM (canvas, organic sway) ============\n  const sakuraCanvas = document.getElementById('sakura');\n  const sakuraCtx = sakuraCanvas.getContext('2d');\n  let W = 0, H = 0;\n\n  function resizeCanvas(c) {\n    const dpr = window.devicePixelRatio || 1;\n    c.width = window.innerWidth * dpr;\n    c.height = window.innerHeight * dpr;\n    c.style.width = window.innerWidth + 'px';\n    c.style.height = window.innerHeight + 'px';\n    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);\n  }\n  function resizeAll() {\n    W = window.innerWidth;\n    H = window.innerHeight;\n    resizeCanvas(sakuraCanvas);\n    resizeCanvas(document.getElementById('confetti'));\n  }\n  resizeAll();\n  window.addEventListener('resize', resizeAll);\n\n  const SAKURA_COLORS = [\n    'rgba(250, 219, 224, ALPHA)',\n    'rgba(244, 194, 204, ALPHA)',\n    'rgba(232, 165, 181, ALPHA)',\n    'rgba(217, 138, 160, ALPHA)',\n    'rgba(255, 235, 240, ALPHA)'\n  ];\n\n  class Petal {\n    constructor() { this.reset(true); }\n    reset(initial = false) {\n      this.x = Math.random() * W;\n      this.y = initial ? Math.random() * H : -30 - Math.random() * 200;\n      this.size = 8 + Math.random() * 10;\n      this.speedY = 0.4 + Math.random() * 0.9;\n      this.swayAmp = 30 + Math.random() * 70;\n      this.swayFreq = 0.0008 + Math.random() * 0.0014;\n      this.swayPhase = Math.random() * Math.PI * 2;\n      this.rot = Math.random() * Math.PI * 2;\n      this.rotSpeed = (Math.random() - 0.5) * 0.02;\n      this.color = SAKURA_COLORS[Math.floor(Math.random() * SAKURA_COLORS.length)];\n      this.alpha = 0.35 + Math.random() * 0.45;\n      this.flutter = Math.random() * Math.PI * 2;\n      this.flutterSpeed = 0.02 + Math.random() * 0.03;\n    }\n    update(t) {\n      // organic sway: layered sine waves\n      this.x += Math.sin(t * this.swayFreq + this.swayPhase) * 0.6\n              + Math.sin(t * this.swayFreq * 2.3) * 0.25;\n      this.y += this.speedY;\n      this.rot += this.rotSpeed;\n      this.flutter += this.flutterSpeed;\n      if (this.y > H + 40) this.reset();\n    }\n    draw(ctx) {\n      const flutter = Math.cos(this.flutter); // -1..1, used to squash petal (3D feel)\n      ctx.save();\n      ctx.translate(this.x, this.y);\n      ctx.rotate(this.rot);\n      ctx.scale(flutter * 0.6 + 0.4, 1); // squash horizontally for 3D rotation feel\n      ctx.fillStyle = this.color.replace('ALPHA', this.alpha.toFixed(2));\n      // sakura petal shape — rounded teardrop with notch\n      ctx.beginPath();\n      const s = this.size;\n      ctx.moveTo(0, -s);\n      ctx.bezierCurveTo(s * 0.7, -s * 0.9, s * 0.9, s * 0.2, 0, s);\n      ctx.bezierCurveTo(-s * 0.9, s * 0.2, -s * 0.7, -s * 0.9, 0, -s);\n      ctx.fill();\n      // subtle notch at top for sakura look\n      ctx.fillStyle = this.color.replace('ALPHA', (this.alpha * 0.6).toFixed(2));\n      ctx.beginPath();\n      ctx.ellipse(0, -s * 0.85, s * 0.14, s * 0.18, 0, 0, Math.PI * 2);\n      ctx.fill();\n      ctx.restore();\n    }\n  }\n\n  const petals = [];\n  const PETAL_COUNT = window.innerWidth < 640 ? 20 : 38;\n  for (let i = 0; i < PETAL_COUNT; i++) petals.push(new Petal());\n\n  function animateSakura(t) {\n    sakuraCtx.clearRect(0, 0, W, H);\n    for (const p of petals) {\n      p.update(t);\n      p.draw(sakuraCtx);\n    }\n    requestAnimationFrame(animateSakura);\n  }\n  requestAnimationFrame(animateSakura);\n\n  // ============ ENVELOPE OPEN ============\n  const stage = document.getElementById('stage');\n  const envelopeWrap = document.getElementById('envelopeWrap');\n  const envelope = document.getElementById('envelope');\n  const reader = document.getElementById('reader');\n  const letter = document.getElementById('letter');\n  const progress = document.getElementById('progress');\n  const progressFill = document.getElementById('progressFill');\n\n  const ticketOverlay = document.getElementById('ticketOverlay');\n  const ticketWrap = document.getElementById('ticketWrap');\n  const restartWrap = document.getElementById('restartWrap');\n  const scrollTrack = document.querySelector('.scroll-track');\n\n  let isOpen = false;\n  let scrollAnim = null;\n  let scrollDuration = 110000;\n  let confettiFired = false;\n  let ticketRevealed = false;\n\n  // Position state — px translateY of letter (0 = at rest top, increases as it goes up = more negative translate)\n  // We use a single \"progress in px\" variable: how far the letter has traveled upward.\n  let scrollOffset = 0;     // current px offset (manual + auto combined)\n  let totalDistance = 0;    // total px to travel\n  let letterStartY = 0;     // initial translateY\n  let lastFrameTime = 0;\n  let autoSpeed = 0;        // px/ms\n  let manualVelocity = 0;   // for momentum after release\n\n  function openEnvelope() {\n    if (isOpen) return;\n    isOpen = true;\n    confettiFired = false;\n    envelope.classList.add('opening');\n\n    setTimeout(() => {\n      stage.classList.add('hidden');\n      reader.classList.add('active');\n      progress.classList.add('visible');\n      startScroll();\n    }, 1000);\n  }\n\n  function startScroll() {\n    const vh = window.innerHeight;\n    const letterHeight = letter.offsetHeight;\n    // Letter has top:0. Start with letter just below viewport (translateY = vh).\n    // End when letter has moved up so its bottom is above viewport top: translateY = -(letterHeight + 80).\n    letterStartY = vh;\n    const endY = -(letterHeight + 80);\n    totalDistance = letterStartY - endY; // total px to travel upward\n\n    scrollDuration = Math.max(85000, (letterHeight / vh) * 40000);\n    autoSpeed = totalDistance / scrollDuration; // px per ms\n\n    scrollOffset = 0;\n    manualVelocity = 0;\n    lastFrameTime = performance.now();\n    applyScroll();\n\n    function tick(now) {\n      const dt = Math.min(now - lastFrameTime, 60);\n      lastFrameTime = now;\n\n      // Auto-advance unless user is actively dragging\n      if (!isDragging) {\n        scrollOffset += autoSpeed * dt;\n        // Apply manual momentum decay\n        if (Math.abs(manualVelocity) > 0.01) {\n          scrollOffset += manualVelocity * dt;\n          manualVelocity *= Math.pow(0.92, dt / 16);\n        }\n      }\n\n      // Clamp — allow slight overscroll back, hard cap forward\n      if (scrollOffset < 0) scrollOffset = 0;\n      if (scrollOffset > totalDistance) scrollOffset = totalDistance;\n\n      applyScroll();\n\n      const t = scrollOffset / totalDistance;\n      progressFill.style.height = (t * 100) + '%';\n\n      // Trigger when the signature element's center passes through viewport center\n      if (!ticketRevealed) {\n        const sig = letter.querySelector('.signature');\n        if (sig) {\n          const rect = sig.getBoundingClientRect();\n          const sigCenter = rect.top + rect.height / 2;\n          const vpCenter = window.innerHeight / 2;\n          if (sigCenter <= vpCenter) {\n            ticketRevealed = true;\n            confettiFired = true;\n            fireConfetti();\n            revealTicket();\n          }\n        }\n      }\n\n      scrollAnim = requestAnimationFrame(tick);\n    }\n    scrollAnim = requestAnimationFrame(tick);\n  }\n\n  function applyScroll() {\n    const y = letterStartY - scrollOffset;\n    letter.style.transform = `translate(-50%, ${y}px) rotateX(22deg)`;\n  }\n\n  function revealTicket() {\n    // Fade out the letter and the reading masks\n    letter.classList.add('fading');\n    document.querySelector('.reader-fade-top').style.transition = 'opacity 0.8s ease';\n    document.querySelector('.reader-fade-bottom').style.transition = 'opacity 0.8s ease';\n    document.querySelector('.reader-fade-top').style.opacity = '0';\n    document.querySelector('.reader-fade-bottom').style.opacity = '0';\n    progress.style.opacity = '0';\n\n    // Reveal ticket after the fade\n    setTimeout(() => {\n      ticketOverlay.classList.add('visible');\n      ticketWrap.classList.add('visible');\n      restartWrap.classList.add('visible');\n    }, 700);\n\n    // Extra confetti burst aimed at the ticket\n    setTimeout(() => {\n      const rect = ticketWrap.getBoundingClientRect();\n      const cx = rect.left + rect.width / 2;\n      const cy = rect.top + rect.height / 2;\n      for (let i = 0; i < 50; i++) confettiPieces.push(new ConfettiPiece(cx, cy));\n    }, 1400);\n  }\n\n  // ============ MANUAL SCROLL / SWIPE ============\n  let isDragging = false;\n  let dragStartY = 0;\n  let dragStartOffset = 0;\n  let lastDragY = 0;\n  let lastDragTime = 0;\n\n  function onDragStart(clientY) {\n    if (!isOpen) return;\n    isDragging = true;\n    dragStartY = clientY;\n    lastDragY = clientY;\n    lastDragTime = performance.now();\n    dragStartOffset = scrollOffset;\n    manualVelocity = 0;\n  }\n  function onDragMove(clientY) {\n    if (!isDragging) return;\n    const delta = dragStartY - clientY; // dragging up = positive delta = scroll forward\n    scrollOffset = dragStartOffset + delta;\n    if (scrollOffset < 0) scrollOffset = 0;\n    if (scrollOffset > totalDistance) scrollOffset = totalDistance;\n    const now = performance.now();\n    const dy = lastDragY - clientY;\n    const dtm = now - lastDragTime;\n    if (dtm > 0) manualVelocity = dy / dtm; // px/ms\n    lastDragY = clientY;\n    lastDragTime = now;\n  }\n  function onDragEnd() {\n    isDragging = false;\n  }\n\n  if (scrollTrack) {\n    // wheel\n    scrollTrack.addEventListener('wheel', (e) => {\n      if (!isOpen) return;\n      e.preventDefault();\n      scrollOffset += e.deltaY * 1.2;\n      if (scrollOffset < 0) scrollOffset = 0;\n      if (scrollOffset > totalDistance) scrollOffset = totalDistance;\n      manualVelocity = e.deltaY * 0.05;\n    }, { passive: false });\n\n    // touch\n    scrollTrack.addEventListener('touchstart', (e) => {\n      onDragStart(e.touches[0].clientY);\n    }, { passive: true });\n    scrollTrack.addEventListener('touchmove', (e) => {\n      onDragMove(e.touches[0].clientY);\n    }, { passive: true });\n    scrollTrack.addEventListener('touchend', onDragEnd);\n    scrollTrack.addEventListener('touchcancel', onDragEnd);\n\n    // mouse drag\n    scrollTrack.addEventListener('mousedown', (e) => {\n      // don't hijack clicks on the restart button or ticket links\n      if (e.target.closest('.restart-btn')) return;\n      onDragStart(e.clientY);\n      e.preventDefault();\n    });\n    window.addEventListener('mousemove', (e) => onDragMove(e.clientY));\n    window.addEventListener('mouseup', onDragEnd);\n  }\n\n  function resetLetter() {\n    if (scrollAnim) cancelAnimationFrame(scrollAnim);\n    envelope.classList.remove('opening');\n    reader.classList.remove('active');\n    progress.classList.remove('visible');\n    progressFill.style.height = '0%';\n    letter.style.transform = `translate(-50%, 100vh) rotateX(22deg)`;\n    letterStartY = window.innerHeight;\n    letter.classList.remove('fading');\n    document.querySelector('.reader-fade-top').style.opacity = '';\n    document.querySelector('.reader-fade-bottom').style.opacity = '';\n    progress.style.opacity = '';\n    ticketOverlay.classList.remove('visible');\n    ticketWrap.classList.remove('visible');\n    restartWrap.classList.remove('visible');\n    ticketRevealed = false;\n    confettiFired = false;\n    scrollOffset = 0;\n    confettiPieces.length = 0;\n    setTimeout(() => {\n      stage.classList.remove('hidden');\n      isOpen = false;\n    }, 700);\n  }\n\n  envelopeWrap.addEventListener('click', openEnvelope);\n  document.getElementById('restartBtn').addEventListener('click', resetLetter);\n\n  // ============ MUSIC ============\n  const music = document.getElementById('music');\n  music.addEventListener('click', () => music.classList.toggle('active'));\n\n  // ============ CONFETTI ============\n  const confettiCanvas = document.getElementById('confetti');\n  const cctx = confettiCanvas.getContext('2d');\n  const confettiPieces = [];\n\n  const CONFETTI_COLORS = [\n    '#FADBE0', '#F4C2CC', '#E8A5B5', '#D98AA0',\n    '#FFFFFF', '#FDFCF0', '#FFF0F2', '#F8E1E6'\n  ];\n\n  class ConfettiPiece {\n    constructor(x, y) {\n      this.x = x;\n      this.y = y;\n      const angle = Math.random() * Math.PI * 2;\n      const speed = 4 + Math.random() * 9;\n      this.vx = Math.cos(angle) * speed;\n      this.vy = Math.sin(angle) * speed - 2;\n      this.gravity = 0.18;\n      this.drag = 0.985;\n      this.size = 5 + Math.random() * 7;\n      this.rot = Math.random() * Math.PI * 2;\n      this.rotSpeed = (Math.random() - 0.5) * 0.25;\n      this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];\n      this.life = 1;\n      this.decay = 0.004 + Math.random() * 0.005;\n      this.shape = Math.random() < 0.6 ? 'rect' : 'circle';\n      this.flutter = Math.random() * Math.PI * 2;\n    }\n    update() {\n      this.vx *= this.drag;\n      this.vy = this.vy * this.drag + this.gravity;\n      this.x += this.vx + Math.sin(this.flutter) * 0.5;\n      this.y += this.vy;\n      this.rot += this.rotSpeed;\n      this.flutter += 0.1;\n      this.life -= this.decay;\n    }\n    draw(ctx) {\n      if (this.life <= 0) return;\n      ctx.save();\n      ctx.translate(this.x, this.y);\n      ctx.rotate(this.rot);\n      ctx.globalAlpha = Math.max(0, this.life);\n      ctx.fillStyle = this.color;\n      if (this.shape === 'rect') {\n        ctx.fillRect(-this.size / 2, -this.size / 4, this.size, this.size / 2);\n      } else {\n        ctx.beginPath();\n        ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);\n        ctx.fill();\n      }\n      ctx.restore();\n    }\n  }\n\n  function fireConfetti() {\n    const cx = W / 2;\n    const cy = H * 0.5;\n    // Two bursts for richness\n    for (let i = 0; i < 90; i++) confettiPieces.push(new ConfettiPiece(cx, cy));\n    setTimeout(() => {\n      for (let i = 0; i < 60; i++) confettiPieces.push(new ConfettiPiece(cx - 80, cy - 40));\n      for (let i = 0; i < 60; i++) confettiPieces.push(new ConfettiPiece(cx + 80, cy - 40));\n    }, 220);\n  }\n\n  function animateConfetti() {\n    cctx.clearRect(0, 0, W, H);\n    for (let i = confettiPieces.length - 1; i >= 0; i--) {\n      const p = confettiPieces[i];\n      p.update(); p.draw(cctx);\n      if (p.life <= 0 || p.y > H + 60) confettiPieces.splice(i, 1);\n    }\n    requestAnimationFrame(animateConfetti);\n  }\n  requestAnimationFrame(animateConfetti);\n\n  // ============ DECORATIVE QR CODE ============\n  function buildDecorativeQR() {\n    const SIZE = 25;\n    let seed = 24102021;\n    const rand = () => {\n      seed = (seed * 9301 + 49297) % 233280;\n      return seed / 233280;\n    };\n    const grid = [];\n    for (let r = 0; r < SIZE; r++) {\n      grid[r] = [];\n      for (let c = 0; c < SIZE; c++) grid[r][c] = rand() < 0.48 ? 1 : 0;\n    }\n    const placeFinder = (r0, c0) => {\n      for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {\n        const rr = r0 + r, cc = c0 + c;\n        if (rr < 0 || cc < 0 || rr >= SIZE || cc >= SIZE) continue;\n        const onOuter = r === 0 || r === 6 || c === 0 || c === 6;\n        const onInner = r >= 2 && r <= 4 && c >= 2 && c <= 4;\n        grid[rr][cc] = onOuter || onInner ? 1 : 0;\n      }\n    };\n    placeFinder(0, 0);\n    placeFinder(0, SIZE - 7);\n    placeFinder(SIZE - 7, 0);\n\n    const svgNS = 'http://www.w3.org/2000/svg';\n    const svg = document.createElementNS(svgNS, 'svg');\n    svg.setAttribute('viewBox', `0 0 ${SIZE} ${SIZE}`);\n    svg.setAttribute('shape-rendering', 'crispEdges');\n    const bg = document.createElementNS(svgNS, 'rect');\n    bg.setAttribute('width', SIZE);\n    bg.setAttribute('height', SIZE);\n    bg.setAttribute('fill', '#FDFCF0');\n    svg.appendChild(bg);\n\n    let path = '';\n    for (let r = 0; r < SIZE; r++) {\n      for (let c = 0; c < SIZE; c++) {\n        if (grid[r][c]) path += `M${c} ${r}h1v1h-1z`;\n      }\n    }\n    const p = document.createElementNS(svgNS, 'path');\n    p.setAttribute('d', path);\n    p.setAttribute('fill', '#2A2620');\n    svg.appendChild(p);\n    return svg;\n  }\n\n  const qrHost = document.getElementById('ticketQR');\n  if (qrHost) qrHost.appendChild(buildDecorativeQR());\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
